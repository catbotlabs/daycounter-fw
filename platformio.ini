[platformio]
default_envs = attiny84

[env]
lib_deps =
  https://github.com/cbl-winston/ssd1306.git#2811daa

[env:attiny84]
platform = atmelavr
framework = arduino
board = attiny84

build_flags = -DDISABLEMILLIS
              -D'millis"()"=0uL'
              -DSSD1306_PLATFORM_SPI_DISABLE
              -DSSD1306_UNICODE_DISABLE

;; Upload settings
upload_port = /dev/ttyUSB0
upload_protocol = stk500v1
upload_speed = 115200
upload_flags = 
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED

;; Fuses. Set fuses using `pio run -t fuses`
; Low fuse: disable CKDIV8
board_fuses.lfuse = 0xE2
; High fuse: factory
board_fuses.hfuse = 0xDF
; Extended fuse: factory
board_fuses.efuse = 0xFF

;; Testing settings
[env:test_native]
platform = native