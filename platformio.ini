[env]
lib_deps = ../../lib/microprompt

build_flags = -DMPROMPT_LINE_LEN=24
  -DMPROMPT_CMD_NAME_LEN=18

[env:attiny84]
platform = atmelavr
framework = arduino
board = attiny84

;; Upload settings
upload_port = /dev/ttyUSB0
upload_protocol = stk500v1
upload_speed = 115200
upload_flags = 
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED

;; Fuses. Set fuses using `pio run -t fuses`
; Low fuse: disable CKDIV8
board_fuses.lfuse = 0xE2
; High fuse: factory
board_fuses.hfuse = 0xDF
; Extended fuse: factory
board_fuses.efuse = 0xFF
