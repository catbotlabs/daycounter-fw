[platformio]
default_envs = attiny84

[env:attiny84]
; bare metal AVR, no arduino.
platform = atmelavr
board = attiny84

; The USIWire and SSD1306 libraries are framework=arduino libraries
; according to the PlatformIO registry, but they work without the Arduino core.
; Setting lib_compat_mode=off makes these libraries usable.
lib_compat_mode=off
lib_deps =
  lexus2k/ssd1306
  puuu/USIWire

; CONFIG_PLATFORM_I2C_AVAILABLE tells the ssd1306 library that
; ssd1306_platform_i2cInit is defined (in ssd1306_usi_twi.cpp).
; This lets the me integrate the ssd1306 library with the USIWire
; library without an arduino core. Otherwise, ssd1306 would want to use
; its own separate, less-efficient software I2C.
build_flags =
              -DCONFIG_PLATFORM_I2C_AVAILABLE

;; Upload settings
upload_port = /dev/ttyUSB0
upload_protocol = stk500v1
upload_speed = 115200
upload_flags = 
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED

;; Fuses. Set fuses using `pio run -t fuses`
; Low fuse: disable CKDIV8
board_fuses.lfuse = 0xE2
; High fuse: factory
board_fuses.hfuse = 0xDF
; Extended fuse: factory
board_fuses.efuse = 0xFF

; Unit testing
[env:test_native]
; The unit tests are written for native platform, not for the MCU.
platform = native


; Unit testing - extra thorough.
; This environment runs all tests, including the slow ones.
[env:test_native_max]
extends = env:test_native
build_flags = -D DC_MAX_TESTING
