[platformio]
default_envs = attiny84_uart

[env:attiny84]
; bare metal AVR, no arduino.
platform = atmelavr
board = attiny84

; The USIWire and SSD1306 libraries are framework=arduino libraries
; according to the PlatformIO registry, but they work without the Arduino core.
; Setting lib_compat_mode=off makes these libraries usable.
lib_compat_mode=off
lib_deps =
  https://github.com/cbl-winston/ssd1306.git#2811daa
  https://github.com/technoblogy/tiny-i2c#b05d0c7

;; BUILD FLAGS:

; include/global/ is given as an include path for all source files
; so that the TinyI2C library can find an "Arduino.h" file to make it compile.

; CONFIG_PLATFORM_I2C_AVAILABLE tells the ssd1306 library that
; ssd1306_platform_i2cInit is defined (in ssd1306_usi_twi.cpp).

; This lets the me integrate the ssd1306 library with the TinyI2C
; library without an arduino core. Otherwise, ssd1306 would want to use
; its own separate, less-efficient software I2C.
build_flags =
              -I include/global
              -DCONFIG_PLATFORM_I2C_AVAILABLE
              -DSSD1306_UNICODE_DISABLE

;; Upload settings
upload_port = /dev/ttyUSB0
upload_protocol = stk500v1
upload_speed = 115200
upload_flags = 
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED

;; Fuses. Set fuses using `pio run -t fuses`
; Low fuse: disable CKDIV8
board_fuses.lfuse = 0xE2
; High fuse: BODLEVEL: 1.8V (typ),  EESAVE: Enabled
board_fuses.hfuse = 0xD6
; Extended fuse: factory
board_fuses.efuse = 0xFF

; Standard configuration with UART detection on the OE/UART pin
[env:attiny84_uart]
extends = env:attiny84
build_flags = ${env:attiny84.build_flags}
              -DOEMODE_CHECK

; Unit testing
[env:test_native]
; The unit tests are written for native platform, not for the MCU.
platform = native

; Unit testing - extra thorough.
; This environment runs all tests, including the slow ones.
[env:test_native_max]
extends = env:test_native
build_flags = -D DC_MAX_TESTING
